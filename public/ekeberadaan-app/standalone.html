<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Keberadaan & Sistem Relief SMKAP</title><link rel="stylesheet" href="/ekeberadaan-app/assets/index-DCYbPMHs.css"><link rel="stylesheet" href="/ekeberadaan-app/assets/page-D6-qqPZC.css"><style>#portal-identity-strip{display:none;align-items:center;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:13px max(15px,calc((100% - 1224px)/2 + 15px));color:#edf8f6;background:linear-gradient(145deg,#123f4d,#082b38);border-bottom:1px solid rgba(135,219,212,.2);box-shadow:inset 0 1px rgba(255,255,255,.1)}#portal-identity-strip.is-visible{display:grid}#portal-identity-avatar{width:44px;height:44px;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(126,221,211,.5);border-radius:12px;color:#082e37;background:linear-gradient(135deg,#82dccf,#79c5df);font-size:12px;font-weight:900}#portal-identity-avatar img{width:100%;height:100%;object-fit:cover}#portal-identity-copy{min-width:0}#portal-identity-copy small,#portal-identity-copy strong,#portal-identity-copy span{display:block;min-width:0}#portal-identity-copy small{color:#72d5ca;font-size:9px;font-weight:900;letter-spacing:.12em}#portal-identity-copy strong{margin:3px 0;color:#eef8f6;font-size:14px;overflow-wrap:anywhere}#portal-identity-copy span{color:#9bb8bb;font-size:11px;line-height:1.4;overflow-wrap:anywhere}#portal-identity-grade{padding:6px 9px;border-radius:9px;color:#b7e4df;background:rgba(86,188,175,.14);font-size:10px;font-weight:900;white-space:nowrap}@media(max-width:620px){#portal-identity-strip{grid-template-columns:40px minmax(0,1fr);padding:11px 13px}#portal-identity-avatar{width:40px;height:40px}#portal-identity-grade{display:none}#portal-identity-copy strong{font-size:13px}#portal-identity-copy span{font-size:10px}}</style><link rel="stylesheet" href="/ekeberadaan-app/mobile-attendance.css"></head><body><section id="portal-identity-strip" aria-label="Profil warga sekolah"><span id="portal-identity-avatar"></span><div id="portal-identity-copy"><small>WARGA SEKOLAH</small><strong id="portal-identity-name"></strong><span id="portal-identity-detail"></span></div><b id="portal-identity-grade"></b></section><div id="relief-root"><main class="access-loading"><span>⌁</span><p>Menyediakan Sistem Guru Ganti…</p></main></div><script>(function(){const strip=document.getElementById('portal-identity-strip'),avatar=document.getElementById('portal-identity-avatar'),name=document.getElementById('portal-identity-name'),detail=document.getElementById('portal-identity-detail'),grade=document.getElementById('portal-identity-grade');const initials=value=>String(value||'SM').trim().split(/\s+/).filter(Boolean).slice(0,2).map(word=>word[0]).join('').toUpperCase()||'SM';window.addEventListener('message',event=>{if(event.origin!==window.location.origin||event.data?.type!=='SMKAP_IDENTITY')return;const user=event.data.user;if(!user){strip.classList.remove('is-visible');return}name.textContent=user.name||'Warga SMKAP';detail.textContent=[user.email,user.position||'Warga SMKAP'].filter(Boolean).join(' · ');grade.textContent=user.grade||'';grade.hidden=!user.grade;avatar.replaceChildren();if(user.avatarDataUrl){const image=document.createElement('img');image.src=user.avatarDataUrl;image.alt='';avatar.append(image)}else avatar.textContent=initials(user.name);strip.classList.add('is-visible')})})()</script><script type="module" src="/ekeberadaan-app/standalone.js?v=mobile-attendance-1"></script></body></html>
