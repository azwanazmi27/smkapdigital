name: Deploy verified Cloudflare production
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/migration/cloudflare-20260922'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release gate and deployment credential
        env:
          VERIFIED: ${{ vars.PRODUCTION_RELEASE_VERIFIED }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$VERIFIED" = "true" || { echo 'Production release gate is closed.'; exit 1; }
          test -n "$TOKEN" || { echo 'Missing production deployment token.'; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-application.mjs
      - run: node scripts/prepare-production-ci.mjs
      - name: Deploy existing production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node node_modules/wrangler/bin/wrangler.js deploy --config dist/server/wrangler.production.json
