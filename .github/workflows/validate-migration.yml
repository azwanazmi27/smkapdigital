name: Validate Cloudflare migration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-application.mjs
# Deployment deliberately remains unconfigured until isolated resources,
# recovered secrets, billing approval where needed, and release gates are verified.
